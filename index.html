<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bellmont City</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1231" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bellmont" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Open-world 3D downtown with a day and night cycle." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The fonts don't hold the page up: it's drawn straight away, and the text takes them on as they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@700&family=Lobster&family=Manrope:wght@400;600;700&family=Pacifico&family=Special+Elite&family=Syne:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@700&family=Lobster&family=Manrope:wght@400;600;700&family=Pacifico&family=Special+Elite&family=Syne:wght@600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Cinzel:wght@700&family=Lobster&family=Manrope:wght@400;600;700&family=Pacifico&family=Special+Elite&family=Syne:wght@600;700;800&display=swap" /></noscript>
  </head>
  <body>
    <!-- Before the code arrives: the start page's night backdrop, straight from the page (React replaces it). -->
    <style>.boot{position:fixed;inset:0;background:#0b1230 url("/bg-city.webp") center bottom/cover no-repeat}@media (max-aspect-ratio:1/1){.boot{background-image:url("/bg-city-tall.webp")}}@media (min-aspect-ratio:2/1){.boot{background-image:url("/bg-city-wide.webp")}}</style>
    <div id="root"><div class="boot"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
